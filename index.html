<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flappy Bird – Garden Adventure</title>
  <meta name="description" content="A beautiful nature-themed Flappy Bird adventure with coins, diamonds, wooden pillars and challenge modes." />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=Italianno&family=Berkshire+Swash&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --baby-pink: #ffafd2;
      --deep-pink: #ef6da7;
      --gold: #ffd86b;
      --sky: #75c9f4;
      --wood-dark: #70401f;
      --wood-light: #c58a50;
      --bg-dark: #52aeda;
    }

    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      background: #87cdf7;
      display: block;
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow: hidden;
      user-select: none;
    }

    /* Animated starfield behind everything */
    #starfield {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    #wrapper {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100vw;
      height: 100vh;
    }

    h1.game-title {
      display: none;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #fff 0%, var(--baby-pink) 55%, #ff91bd 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 0 10px rgba(0,245,255,0.6));
      animation: titlePulse 3s ease-in-out infinite;
    }
    @keyframes titlePulse {
      0%,100% { filter: drop-shadow(0 0 10px rgba(0,245,255,0.6)); }
      50%      { filter: drop-shadow(0 0 22px rgba(255,45,120,0.9)); }
    }

    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      overflow: hidden;
      box-shadow: none;
    }

    canvas {
      display: block;
      border-radius: 0;
    }
    #gameCanvas {
      width: 100vw;
      height: 100vh;
    }

    /* ---- OVERLAY PANELS ---- */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      border-radius: 18px;
      transition: opacity 0.4s ease;
    }
    .overlay.hidden { opacity: 0; pointer-events: none; }

    #start-screen {
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.94) 0%, rgba(183,225,249,0.96) 100%);
    }
    #game-over-screen {
      background: rgba(91, 57, 38, 0.72);
      backdrop-filter: blur(5px);
    }
    #game-over-screen .game-over-box {
      min-width: 270px;
      padding: 24px 34px;
      border-radius: 24px;
      text-align: center;
      background: linear-gradient(145deg, #c79a72 0%, #9a6648 52%, #704934 100%);
      border: 3px solid #f5a6c4;
      box-shadow:
        0 18px 35px rgba(48,27,18,0.48),
        inset 8px 8px 16px rgba(255,221,185,0.28),
        inset -8px -8px 16px rgba(69,39,25,0.38);
    }
    #game-over-screen #restart-btn {
      color: #ff9fc5;
      border-color: #ff9fc5;
      background: rgba(120,70,50,0.55);
      font-family: 'Berkshire Swash', 'Nectar', 'Brush Script MT', cursive;
      font-weight: 400;
      text-shadow: 0 2px 8px rgba(255,159,197,0.45);
    }

    .panel-title {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      letter-spacing: 3px;
    }
    #start-screen .panel-title  { color: var(--deep-pink); text-shadow: 0 0 12px rgba(255,175,210,0.8); }
    #game-over-screen .panel-title {
      color: #f1dfc3;
      font-family: 'Berkshire Swash', 'Italianno', 'Brush Script MT', cursive;
      font-size: clamp(3rem, 8vw, 4.8rem);
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 0.9;
      -webkit-text-stroke: 1px #b98d62;
      text-shadow:
        0 3px 0 #9b7049,
        0 7px 18px rgba(73,45,29,0.55);
    }

    .score-display {
      font-size: clamp(1.2rem, 3.5vw, 1.8rem);
      color: var(--gold);
      text-shadow: 0 0 12px var(--gold);
    }
    .best-display {
      font-size: clamp(0.75rem, 2vw, 1rem);
      color: rgba(255,215,0,0.6);
      letter-spacing: 2px;
    }

    .hint-text {
      font-family: 'Inter', sans-serif;
      font-size: clamp(0.75rem, 2vw, 0.95rem);
      color: rgba(200,220,255,0.7);
      letter-spacing: 1px;
    }

    .btn {
      padding: 14px 44px;
      border: 2px solid var(--baby-pink);
      border-radius: 50px;
      background: rgba(255,175,210,0.12);
      color: var(--deep-pink);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      font-weight: 700;
      letter-spacing: 3px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 15px rgba(0,245,255,0.3), inset 0 0 15px rgba(0,245,255,0.05);
    }
    .btn:hover, .btn:focus {
      background: rgba(0,245,255,0.18);
      box-shadow: 0 0 30px rgba(0,245,255,0.6), inset 0 0 20px rgba(0,245,255,0.12);
      transform: scale(1.05);
      outline: none;
    }
    .btn:active { transform: scale(0.97); }

    /* HUD score badge */
    #hud {
      position: absolute;
      top: 16px;
      left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: none;
      font-size: clamp(0.75rem, 2vw, 1rem);
    }
    .hud-badge {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(0,245,255,0.3);
      border-radius: 30px;
      padding: 6px 18px;
      color: white;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(6px);
    }
    .hud-badge span.label {
      font-size: 0.65em;
      color: rgba(200,220,255,0.6);
      letter-spacing: 2px;
    }
    .hud-badge span.value {
      color: var(--gold);
      text-shadow: 0 0 8px var(--gold);
    }

    .mode-buttons { display: flex; gap: 10px; }
    .mode-buttons .btn { padding: 10px 22px; border-color: var(--baby-pink); color: #b84f80; }
    #red-zone {
      position: absolute; inset: 0; border: 8px solid #ef2b45; border-radius: 18px;
      opacity: 0; pointer-events: none; box-shadow: inset 0 0 40px rgba(239,43,69,0.75); transition: opacity 0.2s;
      z-index: 5;
    }
    #red-zone.active { opacity: 1; }
    #red-zone span { position: absolute; top: 54px; left: 0; right: 0; text-align: center; color: white; text-shadow: 0 2px 8px #b00022; font-family: 'Inter', sans-serif; }

    .controls-hint {
      display: none;
    }

    .controls-hint-old {
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      color: rgba(200,220,255,0.4);
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

<canvas id="starfield"></canvas>

<div id="wrapper">
  <h1 class="game-title">🌸 Garden Bird Adventure</h1>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>

    <!-- HUD (visible during play) -->
    <div id="hud">
      <div class="hud-badge">
        <span class="label">SCORE</span>
        <span class="value" id="hud-score">0</span>
      </div>
      <div class="hud-badge">
        <span class="label">BEST</span>
        <span class="value" id="hud-best">0</span>
      </div>
      <div class="hud-badge">
        <span class="label">LEVEL</span>
        <span class="value" id="hud-level">1</span>
      </div>
    </div>
    <div id="red-zone"><span id="red-zone-time">DANGER 10</span></div>

    <!-- Start Screen -->
    <div class="overlay" id="start-screen">
      <div class="panel-title">Choose Your Challenge</div>
      <p class="hint-text">Collect 🪙 coins and 💎 diamonds · Avoid insects 🐞</p>
      <div class="mode-buttons">
        <button class="btn" id="hard-btn">HARD</button>
        <button class="btn" id="pro-btn">PRO</button>
      </div>
      <p class="hint-text">SPACE · CLICK · TAP TO FLAP</p>
    </div>

    <!-- Game Over Screen -->
    <div class="overlay hidden" id="game-over-screen">
      <div class="game-over-box">
        <div class="panel-title">GAME OVER</div>
        <div class="score-display" id="final-score">SCORE: 0</div>
        <div class="best-display" id="final-best">BEST: 0</div>
        <button class="btn" id="restart-btn">PLAY AGAIN</button>
      </div>
    </div>
  </div>

  <p class="controls-hint">SPACE · CLICK · TAP TO FLAP</p>
</div>

<script>
/* =============================================
   STARFIELD BACKGROUND
   ============================================= */
(function () {
  const sf = document.getElementById('starfield');
  const ctx = sf.getContext('2d');
  let stars = [];

  function resize() {
    sf.width  = window.innerWidth;
    sf.height = window.innerHeight;
    stars = Array.from({ length: 160 }, () => ({
      x:    Math.random() * sf.width,
      y:    Math.random() * sf.height,
      r:    Math.random() * 1.4 + 0.3,
      a:    Math.random(),
      da:   (Math.random() * 0.008 + 0.002) * (Math.random() < 0.5 ? 1 : -1),
      spd:  Math.random() * 0.3 + 0.05,
    }));
  }
  window.addEventListener('resize', resize);
  resize();

  function drawStars() {
    ctx.clearRect(0, 0, sf.width, sf.height);
    for (const s of stars) {
      s.a += s.da;
      if (s.a <= 0 || s.a >= 1) s.da *= -1;
      s.x -= s.spd;
      if (s.x < 0) { s.x = sf.width; s.y = Math.random() * sf.height; }
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,230,255,${s.a.toFixed(2)})`;
      ctx.fill();
    }
    requestAnimationFrame(drawStars);
  }
  drawStars();
})();

/* =============================================
   GAME ENGINE
   ============================================= */
(function () {
  /* ---- Canvas setup ---- */
  const canvas = document.getElementById('gameCanvas');
  const ctx    = canvas.getContext('2d');

  const W = 960, H = 540;
  canvas.width  = W;
  canvas.height = H;

  /* ---- UI references ---- */
  const startScreen    = document.getElementById('start-screen');
  const gameOverScreen = document.getElementById('game-over-screen');
  const hardBtn        = document.getElementById('hard-btn');
  const proBtn         = document.getElementById('pro-btn');
  const restartBtn     = document.getElementById('restart-btn');
  const hudScore       = document.getElementById('hud-score');
  const hudBest        = document.getElementById('hud-best');
  const hudLevel       = document.getElementById('hud-level');
  const finalScore     = document.getElementById('final-score');
  const finalBest      = document.getElementById('final-best');
  const redZone        = document.getElementById('red-zone');
  const redZoneTime    = document.getElementById('red-zone-time');

  /* ---- State ---- */
  const STATE = { IDLE: 0, PLAYING: 1, DEAD: 2 };
  let state = STATE.IDLE;
  let score = 0;
  let level = 1;
  let selectedMode = 'HARD';
  let pipeSpeed = 2.6;
  let redZoneUntil = 0;
  let secondInsectWindow = false;
  let best  = parseInt(localStorage.getItem('fb_best') || '0', 10);
  hudBest.textContent = best;
  hudLevel.textContent = level;

  /* ---- Particle pool ---- */
  let particles = [];
  function spawnParticles(x, y, color, count = 14) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 4 + 1;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: Math.random() * 0.03 + 0.02,
        r: Math.random() * 4 + 2,
        color,
      });
    }
  }

  /* ---- Cloud objects ---- */
  let clouds = [];
  function resetClouds() {
    clouds = Array.from({ length: 5 }, (_, i) => ({
      x: (W / 5) * i + Math.random() * 60,
      y: Math.random() * H * 0.4 + 20,
      w: Math.random() * 80 + 60,
      h: Math.random() * 25 + 15,
      spd: Math.random() * 0.4 + 0.15,
      alpha: Math.random() * 0.08 + 0.04,
    }));
  }
  resetClouds();

  /* ---- Bird ---- */
  const GRAVITY    = 0.16;
  const FLAP_FORCE = -4.8;
  const MAX_FALL_SPEED = 3.4;
  const bird = {
    x: W * 0.25,
    y: H / 2,
    vy: 0,
    r: 18,
    angle: 0,
    flapAnim: 0,
    trail: [],
  };

  function resetBird() {
    bird.x  = W * 0.25;
    bird.y  = H / 2;
    bird.vy = 0;
    bird.angle = 0;
    bird.trail = [];
  }

  function flap() {
    if (state === STATE.DEAD) return;
    if (state === STATE.IDLE) startGame();
    bird.vy = FLAP_FORCE;
    bird.flapAnim = 8;
    spawnParticles(bird.x - 10, bird.y + 6, '#ffafd2', 6);
  }

  /* ---- Wooden pillars and rewards ---- */
  const PIPE_W = 60;
  const PIPE_GAP = 150;
  let pipes = [];
  let items = [];
  let itemTimer = 0;
  let pipeTimer = 0;
  const PIPE_INTERVAL = 125;

  function spawnCluster() {
    const clusterCount = level === 1 ? 1 : (level < 4 ? 2 : 3);
    const clusterWidth = clusterCount * 92;
    const startX = W + 40;
    const pillars = [];

    for (let i = 0; i < clusterCount; i++) {
      const minY = 105;
      const maxY = GROUND_Y - PIPE_GAP - 105;
      const gapY = Math.random() * (maxY - minY) + minY;
      const x = startX + i * 92;
      pillars.push({ x, gapY, scored: false });

    }

    pipes.push({ pillars, clusterWidth, scored: false });
  }

  function resetPipes() {
    pipes = [];
    items = [];
    itemTimer = 0;
    pipeTimer = 0;
  }

  /* ---- Ground ---- */
  const GROUND_H = 70;
  const GROUND_Y = H - GROUND_H;
  let groundOffset = 0;

  /* ---- Game flow ---- */
  function startGame(mode = selectedMode) {
    selectedMode = mode;
    state = STATE.PLAYING;
    score = 0;
    level = 1;
    pipeSpeed = mode === 'PRO' ? 3.2 : 2.6;
    redZoneUntil = 0;
    secondInsectWindow = false;
    redZone.classList.remove('active');
    hudScore.textContent = 0;
    hudLevel.textContent = 1;
    resetBird();
    resetPipes();
    particles = [];
    startScreen.classList.add('hidden');
    gameOverScreen.classList.add('hidden');
  }

  function endGame() {
    state = STATE.DEAD;
    spawnParticles(bird.x, bird.y, '#ff2d78', 28);
    if (score > best) {
      best = score;
      localStorage.setItem('fb_best', best);
    }
    hudBest.textContent    = best;
    finalScore.textContent = `SCORE: ${score}`;
    finalBest.textContent  = `BEST:  ${best}`;
    setTimeout(() => {
      gameOverScreen.classList.remove('hidden');
    }, 700);
  }

  /* ---- Input ---- */
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); flap(); }
  });
  canvas.addEventListener('pointerdown', e => { e.preventDefault(); flap(); });
  hardBtn.addEventListener('click', () => startGame('HARD'));
  proBtn.addEventListener('click', () => startGame('PRO'));
  restartBtn.addEventListener('click', () => startGame(selectedMode));

  /* ---- Collision ---- */
  function checkCollision() {
    const bx = bird.x, by = bird.y, br = bird.r - 4;
    if (by - br < 0 || by + br > GROUND_Y) return true;
    for (const cluster of pipes) {
      for (const p of cluster.pillars) {
        const hw = PIPE_W / 2 + 2;
        if (bx + br > p.x - hw && bx - br < p.x + hw) {
          if (by - br < p.gapY || by + br > p.gapY + PIPE_GAP) return true;
        }
      }
    }
    return false;
  }

  /* ---- Draw helpers ---- */
  function drawPipe(p) {
    const hw = PIPE_W / 2;
    const capH = 28;
    const capW = PIPE_W + 12;
    const capX = p.x - capW / 2;

    ctx.save();
    ctx.shadowColor = 'rgba(74,47,25,0.45)';
    ctx.shadowBlur = 8;

    function drawWoodBlock(x, y, w, h) {
      const wood = ctx.createLinearGradient(x, 0, x + w, 0);
      wood.addColorStop(0, '#5d351b');
      wood.addColorStop(0.18, '#bc8050');
      wood.addColorStop(0.48, '#dda86d');
      wood.addColorStop(0.72, '#966036');
      wood.addColorStop(1, '#4e2d18');
      ctx.fillStyle = wood;
      ctx.fillRect(x, y, w, h);

      ctx.strokeStyle = 'rgba(82,43,22,0.55)';
      ctx.lineWidth = 2;
      for (let yy = y + 18; yy < y + h; yy += 32) {
        ctx.beginPath(); ctx.moveTo(x + 5, yy); ctx.bezierCurveTo(x + w * 0.3, yy - 6, x + w * 0.7, yy + 8, x + w - 5, yy); ctx.stroke();
      }
      ctx.strokeStyle = 'rgba(255,220,170,0.35)';
      ctx.beginPath(); ctx.moveTo(x + w * 0.22, y); ctx.lineTo(x + w * 0.22, y + h); ctx.stroke();
    }

    drawWoodBlock(p.x - hw, 0, PIPE_W, p.gapY - capH);
    drawWoodBlock(p.x - hw, p.gapY + PIPE_GAP + capH, PIPE_W, GROUND_Y - (p.gapY + PIPE_GAP + capH));

    ctx.shadowBlur = 5;
    drawWoodBlock(capX, p.gapY - capH, capW, capH);
    drawWoodBlock(capX, p.gapY + PIPE_GAP, capW, capH);

    ctx.restore();
  }

  function drawBird() {
    bird.flapAnim = Math.max(0, bird.flapAnim - 1);

    // Trail
    bird.trail.push({ x: bird.x, y: bird.y });
    if (bird.trail.length > 10) bird.trail.shift();
    for (let i = 0; i < bird.trail.length; i++) {
      const t = bird.trail[i];
      const a = (i / bird.trail.length) * 0.25;
      ctx.beginPath();
      ctx.arc(t.x, t.y, bird.r * 0.5 * (i / bird.trail.length), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,175,210,${a.toFixed(2)})`;
      ctx.fill();
    }

    const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.vy * 0.055));
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(angle);

    // Glow halo
    const grd = ctx.createRadialGradient(0, 0, 4, 0, 0, bird.r + 10);
    grd.addColorStop(0, 'rgba(255,175,210,0.55)');
    grd.addColorStop(1, 'rgba(255,175,210,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(0, 0, bird.r + 10, 0, Math.PI * 2);
    ctx.fill();

    // Body
    const bodyGrd = ctx.createRadialGradient(-4, -4, 2, 0, 0, bird.r);
    bodyGrd.addColorStop(0, '#ffe1ef');
    bodyGrd.addColorStop(0.6, '#ffabd1');
    bodyGrd.addColorStop(1, '#dc709f');
    ctx.fillStyle = bodyGrd;
    ctx.beginPath();
    ctx.arc(0, 0, bird.r, 0, Math.PI * 2);
    ctx.fill();

    // Wing
    const wingAngle = bird.flapAnim > 0 ? -0.6 : 0.3;
    ctx.save();
    ctx.rotate(wingAngle);
    ctx.fillStyle = '#ffb4d2';
    ctx.beginPath();
    ctx.ellipse(-8, 4, 12, 7, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Eye white
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(7, -5, 7, 0, Math.PI * 2);
    ctx.fill();

    // Pupil
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.arc(9, -4, 3.5, 0, Math.PI * 2);
    ctx.fill();

    // Eye shine
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(10, -5.5, 1.3, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = '#fff07a';
    ctx.beginPath();
    ctx.moveTo(14, -2);
    ctx.lineTo(22, 1);
    ctx.lineTo(14, 4);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, W, 0);
    sky.addColorStop(0, '#6c8091');
    sky.addColorStop(0.38, '#91aab8');
    sky.addColorStop(0.68, '#d5bb91');
    sky.addColorStop(1, '#f2c875');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, GROUND_Y);

    const sunset = ctx.createRadialGradient(820, 210, 20, 820, 210, 330);
    sunset.addColorStop(0, 'rgba(255,245,185,0.95)');
    sunset.addColorStop(0.38, 'rgba(247,205,137,0.42)');
    sunset.addColorStop(1, 'rgba(247,205,137,0)');
    ctx.fillStyle = sunset;
    ctx.fillRect(480, 0, 480, GROUND_Y);

    // Soft drifting storybook clouds
    for (const c of clouds) {
      ctx.save();
      ctx.fillStyle = `rgba(250,248,238,${0.42 + c.alpha})`;
      ctx.beginPath();
      ctx.ellipse(c.x, c.y, c.w * 0.5, c.h * 0.42, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x - c.w * 0.28, c.y + 5, c.w * 0.28, c.h * 0.34, 0, 0, Math.PI * 2);
      ctx.ellipse(c.x + c.w * 0.28, c.y + 4, c.w * 0.34, c.h * 0.36, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      if (state === STATE.PLAYING) {
        c.x -= c.spd * 0.55;
        if (c.x + c.w < 0) c.x = W + c.w;
      }
    }

    // Snow-capped mountain
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(290, 410); ctx.lineTo(520, 82); ctx.lineTo(748, 410); ctx.closePath();
    const mountain = ctx.createLinearGradient(520, 82, 520, 410);
    mountain.addColorStop(0, '#ece7e3'); mountain.addColorStop(0.45, '#9da6b2'); mountain.addColorStop(1, '#626e7d');
    ctx.fillStyle = mountain; ctx.fill();
    ctx.beginPath();
    ctx.moveTo(520,82); ctx.lineTo(450,198); ctx.lineTo(493,183); ctx.lineTo(520,210); ctx.lineTo(548,180); ctx.lineTo(586,198); ctx.closePath();
    ctx.fillStyle='rgba(255,255,248,0.96)'; ctx.fill();
    ctx.restore();

    // Left castle cliff
    ctx.fillStyle = '#6e8061';
    ctx.beginPath(); ctx.moveTo(0,270); ctx.quadraticCurveTo(95,255,205,305); ctx.lineTo(205,470); ctx.lineTo(0,470); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#526d4d';
    ctx.beginPath(); ctx.moveTo(0,330); ctx.quadraticCurveTo(95,300,205,340); ctx.lineTo(205,470); ctx.lineTo(0,470); ctx.closePath(); ctx.fill();

    // Cream fairy-tale castle
    ctx.save();
    ctx.shadowColor='rgba(42,54,55,0.28)'; ctx.shadowBlur=12;
    ctx.fillStyle='#dfd3b5';
    ctx.fillRect(48,205,245,155);
    ctx.fillRect(88,155,62,205); ctx.fillRect(205,128,68,232);
    ctx.fillStyle='#c9b994';
    ctx.fillRect(48,205,245,18);

    function tower(x, y, w, h) {
      ctx.fillStyle='#ddd2b5'; ctx.fillRect(x,y,w,h);
      ctx.beginPath(); ctx.moveTo(x-9,y); ctx.lineTo(x+w/2,y-h*0.28); ctx.lineTo(x+w+9,y); ctx.closePath();
      ctx.fillStyle='#315f63'; ctx.fill();
      ctx.fillStyle='#f2ddbd';
      ctx.beginPath(); ctx.ellipse(x+w/2,y+38,8,16,0,0,Math.PI*2); ctx.fill();
    }
    tower(88,155,62,205); tower(205,128,68,232);
    tower(22,232,48,128);

    // Castle masonry and gate
    ctx.strokeStyle='rgba(132,112,82,0.24)'; ctx.lineWidth=2;
    for(let y=220;y<350;y+=22){ctx.beginPath();ctx.moveTo(48,y);ctx.lineTo(293,y);ctx.stroke();}
    ctx.fillStyle='#70482d';
    ctx.beginPath(); ctx.moveTo(118,360); ctx.lineTo(118,300); ctx.quadraticCurveTo(118,264,154,264); ctx.quadraticCurveTo(190,264,190,300); ctx.lineTo(190,360); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#9d744f'; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(154,268); ctx.lineTo(154,358); ctx.stroke();
    ctx.restore();

    // Autumn tree beside castle
    ctx.fillStyle='#72502e'; ctx.fillRect(304,298,18,62);
    ctx.fillStyle='#df8c3a';
    for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(300+(i%3)*18,278+(i%2)*15,24-(i%2)*5,0,Math.PI*2);ctx.fill();}

    // Right grassy hill
    ctx.fillStyle='#54784c';
    ctx.beginPath(); ctx.moveTo(650,470); ctx.quadraticCurveTo(760,338,960,376); ctx.lineTo(960,470); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#718d55';
    ctx.beginPath(); ctx.moveTo(700,470); ctx.quadraticCurveTo(800,362,960,405); ctx.lineTo(960,470); ctx.closePath(); ctx.fill();

    // Long stone bridge with three arches
    ctx.fillStyle='#b6aa91';
    ctx.beginPath(); ctx.moveTo(175,404); ctx.lineTo(720,404); ctx.quadraticCurveTo(735,414,720,426); ctx.lineTo(175,426); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#9a927c';
    ctx.fillRect(175,426,545,18);
    ctx.strokeStyle='rgba(92,82,69,0.55)'; ctx.lineWidth=3;
    for(let x=300;x<650;x+=115){
      ctx.beginPath();ctx.moveTo(x,426);ctx.quadraticCurveTo(x+58,360,x+116,426);ctx.closePath();ctx.stroke();
      ctx.fillStyle='#5d7b82';ctx.fill();
    }

    // Magical white griffin / dragon at sunset
    const t=Date.now()/1000;
    const gx=770+Math.sin(t*0.55)*18, gy=172+Math.sin(t*1.1)*7;
    ctx.save(); ctx.translate(gx,gy); ctx.scale(1.12,1.12);
    ctx.fillStyle='rgba(255,250,228,0.95)'; ctx.strokeStyle='#fffdf4'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(-10,-5); ctx.quadraticCurveTo(-70,-48,-112,-18); ctx.quadraticCurveTo(-76,-8,-25,12); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(8,-8); ctx.quadraticCurveTo(74,-55,112,-20); ctx.quadraticCurveTo(70,-12,20,12); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0,5,28,15,-0.2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(22,0);ctx.lineTo(48,-8);ctx.lineTo(28,12);ctx.closePath();ctx.fill();
    ctx.restore();

    // Large dark-green branch framing top-right
    ctx.strokeStyle='#244b32'; ctx.lineWidth=19;
    ctx.beginPath(); ctx.moveTo(960,0); ctx.quadraticCurveTo(885,58,790,92); ctx.stroke();
    ctx.strokeStyle='#365d3a'; ctx.lineWidth=8;
    ctx.beginPath();ctx.moveTo(885,45);ctx.quadraticCurveTo(850,86,858,125);ctx.moveTo(825,75);ctx.quadraticCurveTo(790,112,775,145);ctx.stroke();
    ctx.fillStyle='#3f7046';
    for(let i=0;i<16;i++){const lx=808+i*10-(i%3)*8,ly=20+(i%5)*23;ctx.beginPath();ctx.ellipse(lx,ly,18,8,-0.5+i*0.08,0,Math.PI*2);ctx.fill();}

    // Mist around bridge and water
    ctx.fillStyle='rgba(255,255,255,0.72)';
    for(let i=0;i<7;i++){ctx.beginPath();ctx.ellipse(230+i*105,448+(i%2)*12,72,18,0,0,Math.PI*2);ctx.fill();}
  }

  function drawGround() {
    const water = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    water.addColorStop(0, '#88bdaf');
    water.addColorStop(0.22, '#72a9a2');
    water.addColorStop(0.7, '#4f8792');
    water.addColorStop(1, '#365f75');
    ctx.fillStyle = water;
    ctx.fillRect(0, GROUND_Y, W, GROUND_H);

    ctx.save();
    ctx.globalAlpha = 0.22;
    const reflection = ctx.createLinearGradient(760, GROUND_Y, 850, H);
    reflection.addColorStop(0, '#fff4bd');
    reflection.addColorStop(1, 'rgba(255,244,189,0)');
    ctx.fillStyle = reflection;
    ctx.beginPath(); ctx.moveTo(760, GROUND_Y); ctx.lineTo(865, GROUND_Y); ctx.lineTo(820, H); ctx.lineTo(690, H); ctx.closePath(); ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(232,246,224,0.72)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (state === STATE.PLAYING) groundOffset = (groundOffset + pipeSpeed) % 55;
    for (let x = -55 + groundOffset; x < W + 55; x += 55) {
      ctx.moveTo(x, GROUND_Y + 18);
      ctx.quadraticCurveTo(x + 14, GROUND_Y + 11, x + 28, GROUND_Y + 18);
    }
    ctx.stroke();
  }

  function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += 0.12;
      p.life -= p.decay;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawItem(item) {
    ctx.save();
    ctx.translate(item.x, item.y);
    item.pulse += 0.08;
    const scale = 1 + Math.sin(item.pulse) * 0.08;
    ctx.scale(scale, scale);

    if (item.type === 'coin') {
      ctx.fillStyle = '#ffd86b'; ctx.strokeStyle = '#fff3a6'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#c78a24'; ctx.font = 'bold 12px Georgia'; ctx.textAlign = 'center'; ctx.fillText('$', 0, 4);
    } else if (item.type === 'diamond') {
      ctx.fillStyle = '#52d9ff'; ctx.strokeStyle = '#e5fbff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(12, -3); ctx.lineTo(7, 11); ctx.lineTo(-7, 11); ctx.lineTo(-12, -3); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.moveTo(-12,-3); ctx.lineTo(12,-3); ctx.moveTo(0,-13); ctx.lineTo(0,11); ctx.stroke();
    } else {
      ctx.fillStyle = '#7d4d25';
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff8da8'; ctx.beginPath(); ctx.arc(-5,-4,3,0,Math.PI*2); ctx.arc(5,-4,3,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#4a2c18'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(-8,-8); ctx.lineTo(-15,-14); ctx.moveTo(8,-8); ctx.lineTo(15,-14); ctx.moveTo(-8,8); ctx.lineTo(-15,14); ctx.moveTo(8,8); ctx.lineTo(15,14); ctx.stroke();
    }
    ctx.restore();
  }

  let scoreFlash = 0;
  function drawScorePopup() {
    if (scoreFlash > 0) {
      ctx.save();
      ctx.globalAlpha = scoreFlash / 20;
      ctx.fillStyle = '#ffd700';
      ctx.font = `bold ${36 - (20 - scoreFlash)}px Cormorant Garamond, Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.fillText(`+1`, W / 2, H / 3);
      ctx.restore();
      scoreFlash--;
    }
  }

  /* ---- Main loop ---- */
  function update() {
    if (state === STATE.PLAYING) {
      bird.vy = Math.min(bird.vy + GRAVITY, MAX_FALL_SPEED);
      bird.y += bird.vy;

      if (redZoneUntil > 0) {
        const remaining = Math.ceil((redZoneUntil - Date.now()) / 1000);
        if (remaining <= 0) {
          redZoneUntil = 0;
          secondInsectWindow = false;
          redZone.classList.remove('active');
        } else {
          redZoneTime.textContent = `DANGER ${remaining}`;
        }
      }

      pipeTimer++;
      itemTimer++;
      const interval = Math.max(selectedMode === 'PRO' ? 92 : 105, PIPE_INTERVAL - level * 7);
      if (pipeTimer >= interval) { spawnCluster(); pipeTimer = 0; }
      if (itemTimer >= (selectedMode === 'PRO' ? 72 : 88)) {
        const roll = Math.random();
        const type = roll < 0.38 ? 'coin' : roll < 0.68 ? 'diamond' : 'insect';
        items.push({
          x: W + 30 + Math.random() * 40,
          y: 105 + Math.random() * 365,
          type,
          collected: false,
          pulse: 0
        });
        itemTimer = 0;
      }

      for (const cluster of pipes) {
        for (const p of cluster.pillars) p.x -= pipeSpeed;
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const cluster = pipes[i];
        if (!cluster.scored && cluster.pillars.every(p => p.x + PIPE_W / 2 < bird.x)) {
          cluster.scored = true;
          score++;
          hudScore.textContent = score;
          scoreFlash = 20;
          spawnParticles(bird.x, bird.y - 20, '#ffd86b', 10);
        }
        if (cluster.pillars.every(p => p.x < -PIPE_W - 20)) pipes.splice(i, 1);
      }

      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.x -= pipeSpeed;
        const distance = Math.hypot(bird.x - item.x, bird.y - item.y);
        if (!item.collected && distance < bird.r + 13) {
          item.collected = true;
          if (item.type === 'coin') {
            score += 1;
            spawnParticles(item.x, item.y, '#ffd86b', 12);
            scoreFlash = 20;
          } else if (item.type === 'diamond') {
            score += 3;
            spawnParticles(item.x, item.y, '#52d9ff', 16);
            scoreFlash = 20;
          } else {
            score = Math.max(0, score - 1);
            spawnParticles(item.x, item.y, '#e95c78', 14);
            if (secondInsectWindow && redZoneUntil > Date.now()) {
              endGame();
            } else {
              secondInsectWindow = true;
              redZoneUntil = Date.now() + 10000;
              redZone.classList.add('active');
            }
          }
          hudScore.textContent = score;
        }
        if (item.collected || item.x < -30) items.splice(i, 1);
      }

      const newLevel = score < 5 ? 1 : score < 12 ? 2 : 3;
      if (newLevel !== level) {
        level = newLevel;
        hudLevel.textContent = level;
        pipeSpeed = (selectedMode === 'PRO' ? 3.2 : 2.6) + (level - 1) * 0.45;
      }

      if (checkCollision()) endGame();
    }

    if (state === STATE.IDLE) {
      bird.y = H / 2 + Math.sin(Date.now() / 400) * 10;
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawBackground();
    for (const cluster of pipes) {
      for (const p of cluster.pillars) drawPipe(p);
    }
    for (const item of items) if (!item.collected) drawItem(item);
    drawGround();
    drawBird();
    drawParticles();
    drawScorePopup();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  loop();
})();
</script>
</body>
</html>
